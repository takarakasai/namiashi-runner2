# namiashi-runner2 — namiashi（LKMTech MG4005 ×12、シリアル直結）の機体固有部分。
#
# **汎用の制御は misa-runner にある。** ここに置くのは、この機体にしか無い
# ものだけ:
#
#   robots/namiashi.toml   プロファイル（配線・モータ id・校正値・WBC のトルク上限）
#   models/namiashi        モデル（.misa とメッシュ）
#   doc/ scripts/          この機体と SBC（radxa-cubie-a7z）の立ち上げ・運用手順
#   src/main.rs            misa_runner を呼ぶだけ（シリアル直結の Plant は
#                          misa-runner の組み込みなので Backend を差す必要が無い）
#   sim/                   articara ベースのシミュレーション資産（起き上がり・
#                          腕攻撃・テレオペ・競技リング・WBC 試験一式）。
#                          **単独 crate**: MuJoCo が要るのでこの package の
#                          ビルドには一切関与しない。`cd sim && cargo test`
#   tools/                 sim の replay トレースを描く動画レンダラ（Python）
#
# **旧 namiashi-runner（github.com/takarakasai/namiashi-runner）は過去の大会の
# 環境再現のために残してある。** 新しい変更はこちらと misa-runner に入れる。
[package]
name = "namiashi-runner2"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Takara Kasai <takara.kasai@gmail.com>"]
publish = false

[[bin]]
name = "namiashi-run"
path = "src/main.rs"

[dependencies]
# **misa-runner は git 依存。** `git clone && cargo build` だけで立ち上がる
# （隣に misa-runner のチェックアウトを置く必要はない）。misa-runner は公開
# リポジトリなので https で取る — SBC に SSH 鍵も認証情報も要らない
# （ssh:// だと cargo の libgit2 が ssh-agent 認証に失敗する環境がある）。
#
# ブランチは指定しない（既定ブランチ = main）。namiashi2027 は main に統合済みで、
# push 先は main になっている（2026-09-10）。
misa-runner = { git = "https://github.com/takarakasai/misa-runner.git" }
# RL 方策の実行系（`policy` サブコマンド）。namiashi 契約（47 入力・位置目標
# のみ）の観測組み立て・参照歩容・tract-onnx 推論はあちらが持つ。
misa-policy-runner = { git = "https://github.com/takarakasai/misa-policy-runner.git" }
# `policy` の WASD テレオペ（go2-runner と同じ）。
crossterm = "0.27"
log = "0.4"
env_logger = "0.11"

# `policy --sim` が MujocoPlant を直接組み立てるための直依存。misa-runner の
# 同名 path 依存と同じ git ソースなので、同一インスタンスに解決される。
[dependencies.misa-plant-mujoco]
git = "https://github.com/takarakasai/misa-runner.git"
package = "misa-plant-mujoco"
optional = true

[dev-dependencies]
# tests/model_consistency.rs（.misa と URDF サイドカーの整合）が TOML を読む。
toml = "0.8"

[features]
default = ["viz"]
# misa-runner 側の feature をそのまま通す。
viz = ["misa-runner/viz"]
sim = ["misa-runner/sim", "dep:misa-plant-mujoco"]
render = ["misa-runner/render"]
