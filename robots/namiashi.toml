[wbc]
# 全身制御。既定は無効（歩容の IK 出力をそのまま位置制御で流す）。
# 有効にするときは README「WBC（全身制御）」を読むこと。
enabled = false
# モデルの effort（連続定格。MG4005E-i10 の 1.5 N·m）に掛ける係数。
# **LKMTech MG4005 の 24 V での瞬時最大トルクは 2.5 N·m**（減速機出力）
# なので 2.5 / 1.5 = 1.667。calf は外側にさらに 1.556 の減速があり、
# 瞬時 3.89 N·m のところを 2.205 × 1.667 = 3.68 で使う（少し控えめ）。
#
# 2.5 N·m は **24 V での値**。バッテリは 19.8 V と 25.6 V の 2 種があり、
# 25.6 V ならこの値が使える。**19.8 V では理屈どおり電圧比で下げる**:
# 1.6667 × 19.8 / 24 = 1.375（まずはこれで。実測で詰める）。
# 電流はベンチ電源の 5 A 制限がテスト用で、電源は最大 30 A、本番バッテリは
# 25 A まで流せる。5 A で試すときだけ max_torque_nm で頭打ちにする。
torque_scale = 1.6667
# torque_scale = 1.375   # 19.8 V バッテリのとき
