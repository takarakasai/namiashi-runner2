name = "namiashi"

[control]
model = "models/namiashi/namiashi.misa"
rate_hz = 200.0
transition_s = 1.5
start_pose = "start"

# 電源投入後の初回起動で、いまの姿勢をマルチターン原点に張り直す。
#
# **起動時にロボットが伏せ姿勢であることが前提。** 立脚中に効くと
# zero_pose_rad 12 軸が全部無効になるので、電源投入後の 1 回だけに
# 限ってある（目印は /dev/shm、再起動で消える）。試合中にサービスが
# 再起動しても張り直さない。
zero_multiturn_on_boot = true
kinematics_pose = "extend"
teleop_timeout_ms = 100

[gait]
stance_height_m = 0.2
swing_height_m = 0.03
max_vx_m_s = 0.15
max_vy_m_s = 0.08
max_wz_rad_s = 0.6
height_range_m = 0.04
crawl_use_linear = false
velocity_ramp_s = 0.5
velocity_ramp_stop_s = 0.15
stop_settle_s = 0.25
# body_attitude_max_rad = 0.0
body_attitude_max_rad = 0.60
body_attitude_tau_s = 0.15

[teleop.vx]
channel = 2
raw_min = 172
raw_center = 992
raw_max = 1811
reverse = false
deadband = 0.06
expo = 0.0

[teleop.vy]
channel = 1
raw_min = 172
raw_center = 992
raw_max = 1811
reverse = false
deadband = 0.06
expo = 0.0

[teleop.wz]
channel = 4
raw_min = 172
raw_center = 992
raw_max = 1811
reverse = false
deadband = 0.06
expo = 0.0

[teleop.height]
channel = 3
raw_min = 172
raw_center = 992
raw_max = 1811
reverse = false
deadband = 0.06
expo = 0.0

[teleop.mode]
channel = 5
thresholds = [
    582,
    1401,
]

[teleop.gait]
channel = 6
thresholds = [
    582,
    1401,
]

[teleop.pose]
channel = 9
thresholds = [992]

[teleop.chicken_head]
channel = 8
thresholds = [992]

[teleop.pose_select]
channel = 10
thresholds = [992]

[teleop.arm]
channel = 7
raw_min = 172
raw_center = 992
raw_max = 1811
reverse = false
deadband = 0.0
expo = 0.0

[poses]
greeting = "wave_fr"
greeting_alt = "wave_fl"
chicken_head_base_rad = 0.0
chicken_head_gain = 1.0
chicken_head_tau_s = 0.05

[hardware]
# 実機との繋ぎ方。**サブテーブルより前に置くこと**（TOML では見出しより
# 後ろの素のキーは、そのテーブルの中身として読まれる）。
kind = "serial"

[hardware.legs]
baud = 2000000
response_timeout_ms = 20
bus_rate_hz = 500.0
gear_ratio = 10.0

default_max_speed_rad_s = 8.0
# **3.0 では歩容に当たっていた。** 2026-09-02 に安全ゲートを実機の指令へ
# 配線したので、そのままだと歩容を鈍らせることになる。**実機の挙動を変え
# たくないので、歩容ではなく上限を上げた**（要求は trot が calf 3.88、
# walk が 5.21 rad/s。`dump` が毎回突き合わせる）。
#
# 目標が跳んだとき（1 周期で 1 rad なら 200 rad/s）は変わらず捕まる。
# モデルの定格は 33.5 rad/s なので、効くのはこちらの 6.0。
max_target_rate_rad_s = 6.0
status_interval_ms = 1000

